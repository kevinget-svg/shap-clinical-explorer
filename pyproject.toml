[project]
name = "shap-clinical-analysis"
version = "0.1.0"
description = "临床试验探索性分析：基于 SHAP 值的可解释机器学习"
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Wang Yafei" }
]
dependencies = [
    "numpy>=2.0,<2.3",
    "pandas>=2.2,<2.3",
    "shap>=0.46,<0.47",
    "survshap>=0.4,<0.5",
    "scikit-learn>=1.5,<1.7",
    "xgboost>=2.1,<3.0",
    "scikit-survival>=0.22,<0.24",
    "statsmodels>=0.14,<0.15",
    "pyreadstat>=1.2,<2.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
viz = [
    "streamlit>=1.40,<2.0",
]

[project.scripts]
shap-pipeline = "core.pipeline:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["shared", "core"] } }

# ---------------------------------------------------------------------------
# Ruff (lint & format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

# ---------------------------------------------------------------------------
# Mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers -p no:debugging"
